name: Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build Windows installer
        run: python packaging/build.py
      - name: Test installation and uninstall
        shell: pwsh
        run: ./packaging/test-install.ps1 -InstallerPath ./build/windows/installer/MayhemCompanionSetup.exe -ReportPath ./build/windows/reports/installed-runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: MayhemCompanion-Windows
          path: |
            build/windows/installer/MayhemCompanionSetup.exe
            build/windows/installer/SHA256SUMS.txt
            build/windows/reports/*.json
          if-no-files-found: error
          retention-days: 14
